<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Source-backed industrial hydrogen offtaker research workspace">
  <title>Hydrogen Offtaker Finder · Opportunity Desk</title>
  <link rel="stylesheet" href="/hydrogen-offtaker.css">
</head>
<body>
  <div class="shell hydrogen-shell">
    <aside class="sidebar hydrogen-sidebar">
      <a class="brand" href="#overview" data-view-link="overview">
        <span class="brand-symbol hydrogen-brand-symbol">H₂</span>
        <span>HYDROGEN OFFTAKERS<small>Industrial opportunity desk</small></span>
      </a>
      <button id="overview-button" class="portfolio-button" data-view-link="overview">
        ▦ &nbsp; Workspace overview <span id="sidebarCandidateCount">0</span>
      </button>
      <div class="side-label">RESEARCH WORKSPACE</div>
      <nav class="tabs hydrogen-tabs" aria-label="Hydrogen workspace">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="candidates">Candidates <span id="candidateCount">0</span></button>
        <button class="tab" data-view="search">Search workspace</button>
        <button class="tab" data-view="review">Review queue</button>
      </nav>
      <footer class="sidebar-footer">
        <span class="live-dot"></span> Standalone · local only
        <small>Source-backed research workspace</small>
      </footer>
    </aside>
    <main>
      <header class="topbar">
        <div class="topbar-context"><span>WORKSPACE <span class="slash">/</span> <span id="breadcrumb">Overview</span></span><small class="topbar-help">Zones with a representative point inside 250 km appear first. Borderline or zone-wide records still require exact GIS validation.</small></div>
        <div class="topbar-filters"><button class="secondary topbar-export" id="exportZoneCsv" type="button">Export CSV</button><label class="topbar-filter"><select id="provider" aria-label="Provider"><option value="brave">Brave Search API</option><option value="serpapi">SerpApi / Google</option></select></label><label class="topbar-filter"><select id="language" aria-label="Language"><option value="en">English</option><option value="pl">Polski</option><option value="de">Deutsch</option></select></label><label class="topbar-filter"><select id="country" aria-label="Country"><option>PL</option><option>DE</option></select></label></div>
      </header>
      <div class="hydrogen-content">
        <header class="hydrogen-page-heading">
          <div>
          </div>
        </header>
        <section id="overview" class="view"></section>
        <section id="candidates" class="view hidden"></section>
        <section id="search" class="view hidden"></section>
        <section id="review" class="view hidden"></section>
        <section id="candidate-detail" class="view hidden"></section>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/hydrogen-offtaker.js"></script>
</body>
</html>
