<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password | Oman Land Tracker</title><link rel="stylesheet" href="/tokens-typography.css"><link rel="stylesheet" href="/auth/auth.css"></head>
  <body><main class="auth-shell"><div class="brand"><span class="brand-mark">OL</span> Oman Land Tracker</div><section class="card">
    <p class="eyebrow">Password recovery</p><h1>Choose a new password</h1><p class="intro">Enter the code from your reset email and a new password.</p>
    <form data-auth-form="reset" novalidate><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Reset code<input name="otp" autocomplete="one-time-code" inputmode="numeric" required></label><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><button type="submit">Set new password</button></form>
    <p class="status" role="status" aria-live="polite"></p><nav class="links"><a href="/auth/forgot-password.html">Send another code</a><a href="/auth/login.html">Back to sign in</a></nav>
  </section></main><script type="module" src="/auth/auth-lifecycle.js"></script></body>
</html>
