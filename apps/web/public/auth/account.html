<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account | Oman Land Tracker</title><link rel="stylesheet" href="/tokens-typography.css"><link rel="stylesheet" href="/auth/auth.css"></head>
  <body><main class="auth-shell"><div class="brand"><span class="brand-mark">OL</span> Oman Land Tracker</div><section class="card">
    <p class="eyebrow">Account</p><h1>Your account</h1><p class="intro">You are signed in as:</p><p class="account-email" data-account-email>Loading account…</p>
    <form data-auth-form="delete" novalidate class="danger-zone"><h2>Delete account</h2><p>This permanently removes this account from the lifecycle branch. Enter your password to confirm.</p><label>Current password<input name="password" type="password" autocomplete="current-password" required></label><button class="danger" type="submit">Delete my account</button></form>
    <p class="status" role="status" aria-live="polite"></p><nav class="links"><a href="/tracker/">Open Oman Land Tracker</a><a href="/auth/login.html">Sign in with another account</a></nav>
  </section></main><script type="module" src="/auth/auth-lifecycle.js"></script></body>
</html>
