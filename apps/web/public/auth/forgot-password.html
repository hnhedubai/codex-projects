<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Oman Land Tracker</title><link rel="stylesheet" href="/tokens-typography.css"><link rel="stylesheet" href="/auth/auth.css"></head>
  <body><main class="auth-shell"><div class="brand"><span class="brand-mark">OL</span> Oman Land Tracker</div><section class="card">
    <p class="eyebrow">Password recovery</p><h1>Reset your password</h1><p class="intro">We will email a password-reset code to the address on your account.</p>

    <p class="status" role="status" aria-live="polite"></p><nav class="links"><a href="/auth/login.html">Back to sign in</a></nav>
  </section></main><script type="module" src="/auth/auth-lifecycle.js"></script></body>
