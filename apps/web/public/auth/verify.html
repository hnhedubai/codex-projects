<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email | Oman Land Tracker</title><link rel="stylesheet" href="/tokens-typography.css"><link rel="stylesheet" href="/auth/auth.css"></head>
  <body><main class="auth-shell"><div class="brand"><span class="brand-mark">OL</span> Oman Land Tracker</div><section class="card">
    <p class="eyebrow">Email verification</p><h1>Enter your code</h1><p class="intro">Enter the verification code sent to your email address.</p>
    <form data-auth-form="verify" novalidate><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Verification code<input name="otp" autocomplete="one-time-code" inputmode="numeric" required></label><button type="submit">Verify email</button></form>
    <p class="status" role="status" aria-live="polite"></p><nav class="links"><a href="/auth/login.html">Back to sign in</a></nav>
  </section></main><script type="module" src="/auth/auth-lifecycle.js"></script></body>
</html>
